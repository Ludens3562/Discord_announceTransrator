version: "3.8"

services:
  disbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: disbot:latest
    container_name: disbot
    restart: unless-stopped
    env_file:
      - app/.env
    environment:
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -o comm= 1 | grep -q python || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: disbot-db
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB は app/.env から読み込む
    env_file:
      - app/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
