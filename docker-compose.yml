version: "3.8"

services:
  disbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: disbot:latest
    container_name: disbot
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
    # ソースを読み取り専用でマウント（開発時のみ変更してください）
    # 注意: アプリは runtime で config.json / channels.json / .env を書き込みます。
    # ホストのソースを読み取り専用でマウントすると実行時に動作が壊れます。
    # 開発時にホットリロードが必要なら明示的に override してください。
    healthcheck:
      test: ["CMD-SHELL", "ps -o comm= 1 | grep -q python || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
